<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <label for="startDate">From</label>
      <input type="date" id="startDate" />
      <label for="endDate">To</label>
      <input type="date" id="endDate" />
      <button id="getImagesButton" type="button">Get Space Images</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="photoModal" class="photo-modal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button id="closeModalButton" class="modal-close" type="button" aria-label="Close dialog">&times;</button>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="photo-date"></p>
      <img id="modalImage" alt="" />
      <a id="modalVideoLink" target="_blank" rel="noopener noreferrer">Watch this APOD video</a>
      <p id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
